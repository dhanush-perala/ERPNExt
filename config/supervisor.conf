; Notes:
; priority=1 --> Lower priorities indicate programs that start first and shut down last
; killasgroup=true --> send kill signal to child processes too

; graceful timeout should always be lower than stopwaitsecs to avoid orphan gunicorn workers.
[program:frappe-bench-new-frappe-web]
command=/home/neemus/frappe-bench-new/env/bin/gunicorn -b 127.0.0.1:8000 -w 9 --max-requests 5000 --max-requests-jitter 500 -t 120 --graceful-timeout 30 frappe.app:application --preload
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/neemus/frappe-bench-new/logs/web.log
stderr_logfile=/home/neemus/frappe-bench-new/logs/web.error.log
stopwaitsecs=40
killasgroup=true
user=neemus
directory=/home/neemus/frappe-bench-new/sites
startretries=10

[program:frappe-bench-new-frappe-schedule]
command=/home/neemus/frappe-bench/env/bin/bench schedule
priority=3
autostart=true
stdout_logfile=/home/neemus/frappe-bench-new/logs/schedule.log
stderr_logfile=/home/neemus/frappe-bench-new/logs/schedule.error.log
user=neemus
directory=/home/neemus/frappe-bench-new
startretries=10



[program:frappe-bench-new-frappe-short-worker]
command=/home/neemus/frappe-bench/env/bin/bench worker --queue short,default
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/neemus/frappe-bench-new/logs/worker.log
stderr_logfile=/home/neemus/frappe-bench-new/logs/worker.error.log
user=neemus
stopwaitsecs=360
directory=/home/neemus/frappe-bench-new
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10

[program:frappe-bench-new-frappe-long-worker]
command=/home/neemus/frappe-bench/env/bin/bench worker --queue long,default,short
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/neemus/frappe-bench-new/logs/worker.log
stderr_logfile=/home/neemus/frappe-bench-new/logs/worker.error.log
user=neemus
stopwaitsecs=1560
directory=/home/neemus/frappe-bench-new
killasgroup=true
numprocs=1
process_name=%(program_name)s-%(process_num)d
startretries=10





[program:frappe-bench-new-redis-cache]
command=/usr/bin/redis-server /home/neemus/frappe-bench-new/config/redis_cache.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/neemus/frappe-bench-new/logs/redis-cache.log
stderr_logfile=/home/neemus/frappe-bench-new/logs/redis-cache.error.log
user=neemus
directory=/home/neemus/frappe-bench-new/sites
startretries=10

[program:frappe-bench-new-redis-queue]
command=/usr/bin/redis-server /home/neemus/frappe-bench-new/config/redis_queue.conf
priority=1
autostart=true
autorestart=true
stdout_logfile=/home/neemus/frappe-bench-new/logs/redis-queue.log
stderr_logfile=/home/neemus/frappe-bench-new/logs/redis-queue.error.log
user=neemus
directory=/home/neemus/frappe-bench-new/sites
startretries=10



[program:frappe-bench-new-node-socketio]
command=/usr/bin/node /home/neemus/frappe-bench-new/apps/frappe/socketio.js
priority=4
autostart=true
autorestart=true
stdout_logfile=/home/neemus/frappe-bench-new/logs/node-socketio.log
stderr_logfile=/home/neemus/frappe-bench-new/logs/node-socketio.error.log
user=neemus
directory=/home/neemus/frappe-bench-new
startretries=10


[group:frappe-bench-new-web]
programs=frappe-bench-new-frappe-web,frappe-bench-new-node-socketio




[group:frappe-bench-new-workers]
programs=frappe-bench-new-frappe-schedule,frappe-bench-new-frappe-short-worker,frappe-bench-new-frappe-long-worker




[group:frappe-bench-new-redis]
programs=frappe-bench-new-redis-cache,frappe-bench-new-redis-queue
