{% extends "templates/web.html" %}
{% block title %}ERP Chat Assistant{% endblock %}

{% block page_content %}
<style>
.chat-wrap { max-width: 760px; margin: 2rem auto; font-family: system-ui, sans-serif; }
.chat-box  { border: 1px solid var(--border-color,#ddd); border-radius:12px; padding:1rem;
             background: var(--bg-color,#fff); height:60vh; overflow-y:auto; }
.msg       { white-space: pre-wrap; margin:.75rem 0; padding:.75rem 1rem; border-radius:10px; line-height:1.4; }
.msg.user  { background:#e8f0ff; text-align:right; }
.msg.bot   { background:#f6f6f6; text-align:left; }
.row       { display:flex; gap:.5rem; margin-top:1rem; }
.row input { flex:1; padding:.75rem 1rem; border-radius:8px; border:1px solid var(--border-color,#ccc); }
.row button{ padding:.75rem 1rem; border-radius:8px; border:1px solid var(--border-color,#ccc);
             cursor:pointer; background:#007bff; color:#fff; }
.row button:hover{ background:#005fcc; }
.small{ color:#888; font-size:.9rem; margin-bottom:.5rem; }
</style>

<div class="chat-wrap">
  <h2>ERP Chat Assistant</h2>
  <p class="small">
    Type any document name or code:<br>
    <b>MR-00017</b>, <b>STE-00045</b>, <b>BOM-ITEM-001</b>, <b>WO-00012</b>, <b>ITEM-0001</b>, etc.
  </p>
  <div id="chat" class="chat-box"></div>
  <div class="row">
    <input id="q" type="text" placeholder="Try: MR-00017" autocomplete="off">
    <button id="send">Search</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const qEl  = document.getElementById('q');
const btn  = document.getElementById('send');

function addMsg(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + (who || 'bot');
  el.innerHTML = text.replace(/\n/g,"<br>");
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

async function ask(q) {
  addMsg(q,'user');
  let url = `/api/method/chat_assistant.api.chat_query?q=${encodeURIComponent(q)}`;

  try {
    // try POST first (works if logged in)
    const r = await fetch('/api/method/chat_assistant.api.chat_query', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'X-Frappe-CSRF-Token':'{{ csrf_token }}'
      },
      body:JSON.stringify({ q })
    });

    if (r.status === 403 || r.status === 400) {
      // fallback to GET if CSRF invalid or guest
      console.warn('CSRF invalid, falling back to GET');
      return await askViaGet(q);
    }

    const data = await r.json();
    handleResponse(data);
  } catch(err) {
    console.warn('POST failed, trying GET', err);
    await askViaGet(q);
  }
}

async function askViaGet(q) {
  try {
    const r = await fetch(`/api/method/chat_assistant.api.chat_query?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    handleResponse(data);
  } catch(e) {
    console.error(e);
    addMsg('Network error: ' + e,'bot');
  }
}

function handleResponse(data) {
  console.log("Server response:", data);
  const res = data.message || data;

  if (!res) return addMsg('No response from server.','bot');
  if (res.ok === false) return addMsg('Error: ' + (res.error || 'Unknown error'),'bot');
  if (!res.answers || !res.answers.length) return addMsg('No details found.','bot');

  res.answers.forEach(a => addMsg(a,'bot'));
}

btn.addEventListener('click',()=>{
  const q=(qEl.value||'').trim();
  if(!q)return;
  ask(q);
  qEl.value='';
  qEl.focus();
});

qEl.addEventListener('keydown',e=>{
  if(e.key==='Enter')btn.click();
});
</script>
{% endblock %}
